<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">PeerAware — Peer Support Awareness Tool</title>
  <desc id="desc">PeerAware logo with emergency medical symbol, teal arc and ECG pulse, and the text Recognize. Support. Strengthen.</desc>
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00837f"/>
      <stop offset="1" stop-color="#0aa39a"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005f69"/>
      <stop offset="1" stop-color="#0a9f94"/>
    </linearGradient>
    <style>
      .navy{fill:#08245f}.teal{fill:#0b8f8d}.navyStroke{stroke:#08245f}.tealStroke{stroke:#0b8f8d}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:4px;fill:#16336d}
    </style>
  </defs>

  <rect width="1600" height="640" fill="#ffffff"/>

  <!-- left emblem -->
  <g transform="translate(54 88)">
    <!-- broken circular arc -->
    <path d="M20 165 A170 170 0 0 1 260 35" fill="none" stroke="url(#tealGrad)" stroke-width="13" stroke-linecap="round"/>
    <path d="M30 250 A170 170 0 0 0 185 420" fill="none" stroke="url(#tealGrad)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="14" cy="201" r="13" fill="#0b8f8d"/>

    <!-- star of life -->
    <g transform="translate(160 212)">
      <polygon class="navy" points="-28,-104 28,-104 28,-58 72,-84 105,-27 64,-3 105,20 72,78 28,52 28,104 -28,104 -28,53 -72,79 -105,21 -64,-3 -105,-27 -72,-84 -28,-58"/>
      <!-- simplified Rod of Asclepius -->
      <line x1="0" y1="-72" x2="0" y2="78" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-72" r="10" fill="#ffffff"/>
      <path d="M13 -50 C-16 -54 -27 -31 -12 -18 C2 -6 19 -15 18 1 C18 20 -13 21 -14 41 C-15 55 -5 62 3 63" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <path d="M-12 -36 C4 -45 23 -37 22 -20 C20 -6 -4 0 -4 18 C-3 31 9 37 13 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- ECG line -->
    <path d="M160 365 H225 L236 347 L248 394 L262 310 L276 369 L291 350 L309 365 H345" fill="none" stroke="url(#tealGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(430 0)">
    <text x="0" y="322" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="168" fill="#08245f" letter-spacing="-5">Peer</text>
    <text x="510" y="322" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="168" fill="url(#wordGrad)" letter-spacing="-6">Aware</text>

    <!-- descriptor row -->
    <line x1="10" y1="386" x2="75" y2="386" class="navyStroke" stroke-width="5"/>
    <text x="100" y="401" class="label" font-size="42">PEER SUPPORT AWARENESS TOOL</text>
    <line x1="1240" y1="386" x2="1310" y2="386" class="navyStroke" stroke-width="5"/>

    <!-- tagline row -->
    <text x="142" y="485" class="label" font-size="34">RECOGNIZE.</text>
    <text x="475" y="485" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" letter-spacing="4" fill="#0b8f8d">SUPPORT.</text>
    <text x="720" y="485" class="label" font-size="34">STRENGTHEN.</text>
  </g>
</svg>
